<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><style>html,body{margin:0}body{font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}#hsTouchTgl.hs-float{top:auto!important;bottom:calc(10px + env(safe-area-inset-bottom,0px));right:10px}
</style></head><body>
<title>Spermaid Survivors</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
/* Layout: one full-screen canvas game with three overlay screens (start, level up, end). Single dark look, blood red on black. */
:root{--bg:#070405;--ink:#0e0708;--line:#4a1a1c;--red:#c4121c;--hot:#ff2630;--bone:#f1e7d0;--ash:#a6968f;--display:'Pirata One',serif;--ui:'Archivo Narrow','Arial Narrow',sans-serif;color-scheme:dark}
html,body{height:100%}
body{margin:0;position:relative;background:var(--bg);color:var(--bone);font-family:var(--ui);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:absolute;inset:0;background:var(--bg)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;background:rgba(7,4,5,0.88);text-align:center;overflow-y:auto}
.screen[hidden]{display:none}
h1,h2,p{margin:0}
h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,12vw,64px);line-height:0.95;color:var(--hot);text-shadow:0 0 22px rgba(196,18,28,0.6);text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;color:var(--hot);text-shadow:0 0 18px rgba(196,18,28,0.5)}
.tag{font-size:16px;font-weight:600;letter-spacing:0.08em;color:var(--bone);max-width:30ch}
.hint{font-size:13px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--ash);max-width:34ch}
.stats{font-size:18px;font-weight:600;letter-spacing:0.06em}
#menuImg{height:clamp(120px,26vh,220px);width:auto;filter:drop-shadow(0 0 22px rgba(196,18,28,0.5))}
.btn{appearance:none;border:0;min-height:52px;min-width:220px;padding:0 28px;background:linear-gradient(180deg,#d8141f 0%,#8e0c14 100%);color:var(--bone);font-family:var(--ui);font-size:17px;font-weight:700;letter-spacing:0.18em;cursor:pointer;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%)}
.btn:focus-visible,.card:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
#choices{display:flex;flex-direction:column;gap:10px;width:min(360px,100%)}
.card{appearance:none;border:0;text-align:left;display:flex;flex-direction:column;gap:4px;padding:14px 16px;min-height:64px;background:var(--ink);box-shadow:inset 0 0 0 1px var(--line);color:var(--bone);font-family:var(--ui);cursor:pointer;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.card:active{box-shadow:inset 0 0 0 2px var(--hot)}
.card b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1;letter-spacing:0.02em}
.card span{font-size:14px;font-weight:500;color:#c9bbb6;line-height:1.25}
</style>

<div id="stage">
<canvas id="c" aria-label="Spermaid Survivors game"></canvas>

<div id="menu" class="screen">
<img id="menuImg" alt="Spermaid" style="display:none">
<h1 style="margin:0"><img src="../assets/surv-logo.webp" alt="Spermaid Survivors" style="display:block;margin:0 auto 6px;width:auto;max-width:min(92%,440px);max-height:min(36vh,240px);object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.8))"></h1>
<p class="tag">Survive the night. Dawn is five minutes away.</p>
<button id="startBtn" class="btn" type="button">START</button>
<p class="hint">Drag anywhere to move. She attacks on her own.</p>
<p class="hint" id="best"></p>
</div>

<div id="levelup" class="screen" hidden>
<h2>Level up</h2>
<div id="choices"></div>
</div>

<div id="over" class="screen" hidden>
<h2 id="overTitle"></h2>
<p class="stats" id="overStats"></p>
<p class="hint" id="overBest"></p>
<button id="againBtn" class="btn" type="button">PLAY AGAIN</button>
</div>
</div>

function resize() {
  var r = stage.getBoundingClientRect();
  W = Math.max(1, Math.floor(r.width));
  H = Math.max(1, Math.floor(r.height));
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.floor(W * DPR);
  cv.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  var g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.hypot(W, H) * 0.6);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.75)');
  vignette = g;
}
window.addEventListener('resize', resize);
resize();

var best = 0;
try { best = parseInt(localStorage.getItem('ss-best') || '0', 10) || 0; } catch (e) {}
function fmt(s) { s = Math.max(0, Math.floor(s)); var m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }
function showBest() {
  document.getElementById('best').textContent = best ? 'Longest night: ' + fmt(best) : '';
}
showBest();

var TYPES = {
  wisp:  { r: 9,  hp: 10,  spd: 78, dmg: 6,  xp: 1 },
  ghoul: { r: 13, hp: 28,  spd: 54, dmg: 10, xp: 2 },
  brute: { r: 22, hp: 120, spd: 36, dmg: 18, xp: 6 }
};

var UPS = [
  { name: 'More Droplets', desc: 'Fire one extra droplet each volley.', ok: function (g) { return g.gun.count < 6; }, ap: function (g) { g.gun.count++; } },
  { name: 'Quick Casting', desc: 'Attack 15% faster.', ok: function (g) { return g.gun.cd > 0.25; }, ap: function (g) { g.gun.cd *= 0.85; } },
  { name: 'Sharper Tides', desc: 'Droplets hit 30% harder.', ok: function () { return true; }, ap: function (g) { g.gun.dmg *= 1.3; } },
  { name: 'Piercing Spray', desc: 'Droplets pass through one more enemy.', ok: function (g) { return g.gun.pierce < 4; }, ap: function (g) { g.gun.pierce++; } },
  { name: 'Bubble Guard', desc: 'Add a bubble that circles you and hurts what it touches.', ok: function (g) { return g.orb.n < 8; }, ap: function (g) { g.orb.n++; } },
  { name: 'Bubble Burst', desc: 'Bubbles hit 40% harder.', ok: function (g) { return g.orb.n > 0; }, ap: function (g) { g.orb.dmg *= 1.4; } },
  { name: 'Swift Tail', desc: 'Move 12% faster.', ok: function (g) { return g.p.spd < 260; }, ap: function (g) { g.p.spd *= 1.12; } },
  { name: 'Deep Lungs', desc: 'Max health +25 and heal 25.', ok: function () { return true; }, ap: function (g) { g.p.max += 25; g.p.hp = Math.min(g.p.max, g.p.hp + 25); } },
  { name: 'Pearl Blessing', desc: 'Heal half of your health.', ok: function (g) { return g.p.hp < g.p.max * 0.9; }, ap: function (g) { g.p.hp = Math.min(g.p.max, g.p.hp + g.p.max * 0.5); } },
  { name: 'Siren Pull', desc: 'Pick up gems from further away.', ok: function (g) { return g.p.mag < 260; }, ap: function (g) { g.p.mag *= 1.5; } }
];

var g = null;
var state = 'menu';
var keys = {};
var joy = { id: null, ox: 0, oy: 0, x: 0, y: 0, on: false };
var R = 52;

function newRun() {
  g = {
    t: 0, kills: 0, lvl: 1, xp: 0, need: 5, shake: 0, spawnT: 0.5,
    p: { x: 0, y: 0, hp: 100, max: 100, spd: 150, face: 1, inv: 0, mag: 70, r: 14, walk: 0 },
    gun: { cd: 0.9, t: 0, dmg: 14, count: 1, pierce: 0 },
    orb: { n: 0, ang: 0, dmg: 12 },
    enemies: [], shots: [], gems: []
  };
}

function el(id) { return document.getElementById(id); }
function show(id, on) { el(id).hidden = !on; }

function startRun() {
  newRun();
  state = 'play';
  show('menu', false); show('over', false); show('levelup', false);
}

function endRun(win) {
  state = 'over';
  var secs = Math.floor(g.t);
  if (secs > best) { best = secs; try { localStorage.setItem('ss-best', String(best)); } catch (e) {} }
  el('overTitle').textContent = win ? 'Dawn breaks' : 'Swallowed by the dark';
  el('overStats').textContent = 'Survived ' + fmt(secs) + ' · ' + g.kills + ' kills · Level ' + g.lvl;
  el('overBest').textContent = 'Longest night: ' + fmt(best);
  show('over', true);
}

function openLevelUp() {
  state = 'levelup';
  var pool = UPS.filter(function (u) { return u.ok(g); });
  for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  var picks = pool.slice(0, 3);
  var box = el('choices');
  while (box.firstChild) box.removeChild(box.firstChild);
  picks.forEach(function (u) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'card';
    var n = document.createElement('b'); n.textContent = u.name;
    var d = document.createElement('span'); d.textContent = u.desc;
    b.appendChild(n); b.appendChild(d);
    b.addEventListener('click', function () { u.ap(g); show('levelup', false); state = 'play'; });
    box.appendChild(b);
  });
  show('levelup', true);
}

el('startBtn').addEventListener('click', startRun);
el('againBtn').addEventListener('click', startRun);

window.addEventListener('keydown', function (e) { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });

cv.addEventListener('pointerdown', function (e) {
  if (state !== 'play' || joy.id !== null) return;
  var r = cv.getBoundingClientRect();
  joy.id = e.pointerId; joy.on = true;
  joy.ox = e.clientX - r.left; joy.oy = e.clientY - r.top; joy.x = 0; joy.y = 0;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', function (e) {
  if (e.pointerId !== joy.id) return;
  var r = cv.getBoundingClientRect();
  var dx = e.clientX - r.left - joy.ox, dy = e.clientY - r.top - joy.oy;
  var l = Math.hypot(dx, dy);
  if (l > R) { dx = dx / l * R; dy = dy / l * R; }
  joy.x = dx / R; joy.y = dy / R;
});
function endPointer(e) {
  if (e.pointerId !== joy.id) return;
  joy.id = null; joy.on = false; joy.x = 0; joy.y = 0;
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

function spawn() {
  if (g.enemies.length >= 240) return;
  var t = g.t, r = Math.random(), type = 'wisp';
  if (t > 90 && r < 0.10) type = 'brute';
  else if (t > 25 && r < 0.40) type = 'ghoul';
  var d = TYPES[type];
  var a = Math.random() * Math.PI * 2;
  var dist = Math.hypot(W, H) / 2 + 40;
  var sc = 1 + t / 110;
  g.enemies.push({
    type: type, x: g.p.x + Math.cos(a) * dist, y: g.p.y + Math.sin(a) * dist,
    r: d.r, hp: d.hp * sc, spd: d.spd * (1 + Math.min(t, 240) / 600),
    dmg: d.dmg, xp: d.xp, flash: 0, oc: 0
  });
}

function update(dt) {
  var p = g.p;
  g.t += dt;
  if (g.t >= DAWN) { endRun(true); return; }

  var ps = window.HSPad ? HSPad.stick() : { on: false };
  var vx = joy.on ? joy.x : ps.on ? ps.x : ((keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0));
  var vy = joy.on ? joy.y : ps.on ? ps.y : ((keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0));
  var vl = Math.hypot(vx, vy);
  if (vl > 1) { vx /= vl; vy /= vl; vl = 1; }
  if (vl < 0.12) { vx = 0; vy = 0; vl = 0; }
  p.x += vx * p.spd * dt; p.y += vy * p.spd * dt;
  if (vx > 0.1) p.face = 1; else if (vx < -0.1) p.face = -1;
  p.walk += vl * dt * 10;
  if (p.inv > 0) p.inv -= dt;
  if (g.shake > 0) g.shake -= dt * 30;

  g.spawnT -= dt;
  var interval = Math.max(0.14, 0.85 - g.t * 0.0024);
  var burst = 1 + Math.floor(g.t / 50);
  while (g.spawnT <= 0) { for (var k = 0; k < burst; k++) spawn(); g.spawnT += interval; }

  var i, j, e, s;

  g.gun.t -= dt;
  if (g.gun.t <= 0 && g.enemies.length) {
    var best2 = null, bd = 1e12;
    for (i = 0; i < g.enemies.length; i++) {
      e = g.enemies[i];
      var d2 = (e.x - p.x) * (e.x - p.x) + (e.y - p.y) * (e.y - p.y);
      if (d2 < bd) { bd = d2; best2 = e; }
    }
    if (best2 && bd < 520 * 520) {
      var base = Math.atan2(best2.y - p.y, best2.x - p.x), n = g.gun.count;
      for (i = 0; i < n; i++) {
        var a = base + (i - (n - 1) / 2) * 0.16;
        g.shots.push({ x: p.x, y: p.y, vx: Math.cos(a) * 380, vy: Math.sin(a) * 380, life: 1.3, dmg: g.gun.dmg, pierce: g.gun.pierce, hit: [] });
      }
      g.gun.t = g.gun.cd;
    }
  }

  for (i = 0; i < g.shots.length; i++) {
    s = g.shots[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    for (j = 0; j < g.enemies.length && s.life > 0; j++) {
      e = g.enemies[j];
      if (s.hit.indexOf(e) > -1) continue;
      var dx = e.x - s.x, dy = e.y - s.y, rr = e.r + 5;
      if (dx * dx + dy * dy < rr * rr) {
        e.hp -= s.dmg; e.flash = 0.1; s.hit.push(e);
        s.pierce -= 1;
        if (s.pierce < 0) s.life = 0;
      }
    }
  }
  g.shots = g.shots.filter(function (q) { return q.life > 0; });

  g.orb.ang += dt * 2.6;
  for (i = 0; i < g.enemies.length; i++) {
    e = g.enemies[i];
    if (e.oc > 0) e.oc -= dt;
    if (e.flash > 0) e.flash -= dt;
    var ddx = p.x - e.x, ddy = p.y - e.y, dl = Math.hypot(ddx, ddy) || 1;
    e.x += ddx / dl * e.spd * dt; e.y += ddy / dl * e.spd * dt;
    if (dl < e.r + p.r && p.inv <= 0) {
      p.hp -= e.dmg; p.inv = 0.5; g.shake = 6;
      if (p.hp <= 0) { endRun(false); return; }
    }
    if (g.orb.n > 0 && e.oc <= 0) {
      for (j = 0; j < g.orb.n; j++) {
        var oa = g.orb.ang + j * Math.PI * 2 / g.orb.n;
        var ox = p.x + Math.cos(oa) * 70, oy = p.y + Math.sin(oa) * 70;
        var ex = e.x - ox, ey = e.y - oy, orr = e.r + 11;
        if (ex * ex + ey * ey < orr * orr) { e.hp -= g.orb.dmg; e.oc = 0.45; e.flash = 0.1; break; }
      }
    }
  }
  var alive = [];
  for (i = 0; i < g.enemies.length; i++) {
    e = g.enemies[i];
    if (e.hp <= 0) { g.kills++; g.gems.push({ x: e.x, y: e.y, v: e.xp }); }
    else alive.push(e);
  }
  g.enemies = alive;
  if (g.gems.length > 300) g.gems.splice(0, g.gems.length - 300);

  var keep = [];
  for (i = 0; i < g.gems.length; i++) {
    var gm = g.gems[i];
    var gx = p.x - gm.x, gy = p.y - gm.y, gl = Math.hypot(gx, gy) || 1;
    if (gl < p.mag) { gm.x += gx / gl * 300 * dt; gm.y += gy / gl * 300 * dt; }
    if (gl < 16) {
      g.xp += gm.v;
    } else keep.push(gm);
  }
  g.gems = keep;
  if (g.xp >= g.need) {
    g.xp -= g.need; g.lvl++; g.need = Math.floor(g.need * 1.35 + 3);
    openLevelUp();
  }
}

function draw() {
  var p = g.p;
  var cx = p.x - W / 2, cy = p.y - H / 2;
  var sh = g.shake > 0 ? g.shake : 0;
  ctx.save();
  if (sh) ctx.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);
  ctx.fillStyle = '#070405';
  ctx.fillRect(-10, -10, W + 20, H + 20);

  ctx.strokeStyle = 'rgba(150,25,32,0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  var gs = 80, ox = -(((cx % gs) + gs) % gs), oy = -(((cy % gs) + gs) % gs);
  for (var x = ox; x < W + gs; x += gs) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (var y = oy; y < H + gs; y += gs) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  var i, e, sx, sy;
  for (i = 0; i < g.gems.length; i++) {
    var gm = g.gems[i]; sx = gm.x - cx; sy = gm.y - cy;
    ctx.fillStyle = '#ff2630';
    ctx.beginPath(); ctx.moveTo(sx, sy - 6); ctx.lineTo(sx + 4, sy); ctx.lineTo(sx, sy + 6); ctx.lineTo(sx - 4, sy); ctx.closePath(); ctx.fill();
  }

  for (i = 0; i < g.enemies.length; i++) {
    e = g.enemies[i]; sx = e.x - cx; sy = e.y - cy;
    if (sx < -60 || sx > W + 60 || sy < -60 || sy > H + 60) continue;
    var fl = e.flash > 0;
    if (e.type === 'wisp') {
      ctx.fillStyle = fl ? '#fff' : '#b3121c';
      ctx.beginPath(); ctx.arc(sx, sy, e.r, 0, 6.2832); ctx.fill();
    } else if (e.type === 'ghoul') {
      ctx.fillStyle = fl ? '#fff' : '#4a0d13';
      ctx.strokeStyle = '#ff2630'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy, e.r, 0, 6.2832); ctx.fill(); ctx.stroke();
    } else {
      ctx.fillStyle = fl ? '#fff' : '#240609';
      ctx.strokeStyle = '#ff2630'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(sx, sy, e.r, 0, 6.2832); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ff2630';
      for (var k = -1; k <= 1; k++) {
        ctx.beginPath(); ctx.moveTo(sx + k * 9 - 5, sy - e.r + 3); ctx.lineTo(sx + k * 9, sy - e.r - 9); ctx.lineTo(sx + k * 9 + 5, sy - e.r + 3); ctx.closePath(); ctx.fill();
      }
    }
    ctx.fillStyle = '#f1e7d0';
    var eo = e.r * 0.35, er = Math.max(1.5, e.r * 0.16);
    ctx.beginPath(); ctx.arc(sx - eo, sy - eo * 0.3, er, 0, 6.2832); ctx.arc(sx + eo, sy - eo * 0.3, er, 0, 6.2832); ctx.fill();
  }

  for (i = 0; i < g.shots.length; i++) {
    var s = g.shots[i]; sx = s.x - cx; sy = s.y - cy;
    ctx.fillStyle = '#f1e7d0';
    ctx.shadowColor = '#ff2630'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(sx, sy, 5, 0, 6.2832); ctx.fill();
    ctx.shadowBlur = 0;
  }

  for (i = 0; i < g.orb.n; i++) {
    var oa = g.orb.ang + i * Math.PI * 2 / g.orb.n;
    sx = p.x + Math.cos(oa) * 70 - cx; sy = p.y + Math.sin(oa) * 70 - cy;
    ctx.fillStyle = 'rgba(241,231,208,0.25)'; ctx.strokeStyle = '#f1e7d0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx, sy, 11, 0, 6.2832); ctx.fill(); ctx.stroke();
  }

  sx = p.x - cx; sy = p.y - cy;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(sx, sy + 28, 16, 5, 0, 0, 6.2832); ctx.fill();
  if (p.inv <= 0 || Math.floor(g.t * 20) % 2 === 0) {
    if (img.complete && img.naturalWidth) {
      var ph = 62, pw = ph * img.naturalWidth / img.naturalHeight, bob = Math.sin(p.walk) * 2;
      ctx.save(); ctx.translate(sx, sy + bob); ctx.scale(p.face, 1);
      ctx.drawImage(img, -pw / 2, -ph / 2, pw, ph);
      ctx.restore();
    } else {
      ctx.fillStyle = '#f1e7d0'; ctx.beginPath(); ctx.arc(sx, sy, 14, 0, 6.2832); ctx.fill();
    }
  }

  if (joy.on && (!window.HSPad || HSPad.touchOn())) {
    ctx.strokeStyle = 'rgba(241,231,208,0.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(joy.ox, joy.oy, R, 0, 6.2832); ctx.stroke();
    ctx.fillStyle = 'rgba(196,18,28,0.6)';
    ctx.beginPath(); ctx.arc(joy.ox + joy.x * R, joy.oy + joy.y * R, 20, 0, 6.2832); ctx.fill();
  }
  ctx.restore();

  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#2a1012'; ctx.fillRect(0, 0, W, 6);
  ctx.fillStyle = '#ff2630'; ctx.fillRect(0, 0, W * Math.min(1, g.xp / g.need), 6);

  ctx.fillStyle = '#2a1012'; ctx.fillRect(14, 20, 130, 12);
  ctx.fillStyle = '#c4121c'; ctx.fillRect(14, 20, 130 * Math.max(0, g.p.hp / g.p.max), 12);
  ctx.strokeStyle = '#4a1a1c'; ctx.lineWidth = 1; ctx.strokeRect(14.5, 20.5, 129, 11);
  ctx.fillStyle = '#f1e7d0'; ctx.textBaseline = 'alphabetic';
  ctx.font = "700 15px 'Archivo Narrow', sans-serif"; ctx.textAlign = 'left';
  ctx.fillText('LV ' + g.lvl, 14, 54);
  ctx.textAlign = 'right';
  ctx.fillText('KILLS ' + g.kills, W - 14, 32);
  ctx.textAlign = 'center';
  ctx.font = "400 30px 'Pirata One', serif";
  ctx.fillText(fmt(DAWN - g.t), W / 2, 42);
  ctx.font = "700 11px 'Archivo Narrow', sans-serif";
  ctx.fillStyle = '#a6968f';
  ctx.fillText('UNTIL DAWN', W / 2, 56);
}

var last = 0;
function frame(ts) {
  var dt = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts;
  if (g) {
    if (state === 'play') update(dt);
    draw();
  } else {
    ctx.fillStyle = '#070405'; ctx.fillRect(0, 0, W, H);
  }
  requestAnimationFrame(frame);
}
newRun();
requestAnimationFrame(frame);
})();
</script>

/* controller in the menus and in play (the stick moves Spermaid), plus the on-screen controls toggle (padkit.js) */
if (window.HSPad) HSPad.setup({ menu: function () { var ids = ["levelup", "over", "menu"]; for (var i = 0; i < ids.length; i++) { var e = document.getElementById(ids[i]); if (e && !e.hidden) return e; } return null; }, toggle: true });
</script>
