<style>

[hidden]{display:none!important}
#app{position:relative;height:100%;display:flex;flex-direction:column}
#view{position:relative;flex:1 1 auto;min-height:0;min-width:0;background:#000}

#top{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));right:8px;z-index:6;display:flex;gap:6px}
.tbtn,#top button{width:38px;height:38px;padding:0;border:0;background:rgba(14,7,8,0.72);box-shadow:inset 0 0 0 2px rgba(255,38,48,0.55);color:var(--bone);cursor:pointer;display:flex;align-items:center;justify-content:center;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}
#top svg{width:20px;height:20px}
#mute .wv{stroke:var(--bone)}#mute .xx{stroke:var(--hot);display:none}#mute.off .wv{display:none}#mute.off .xx{display:block}
#pad{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
#pad>*{pointer-events:auto}
.dpad{position:relative;width:150px;height:150px;border-radius:50%;background:rgba(14,7,8,0.55);box-shadow:inset 0 0 0 2px rgba(255,38,48,0.5);touch-action:none}
.dpad i{position:absolute;width:0;height:0;border:11px solid transparent}
.dpad .u{left:calc(50% - 11px);top:10px;border-bottom:15px solid var(--ash);border-top:0}.dpad .d{left:calc(50% - 11px);bottom:10px;border-top:15px solid var(--ash);border-bottom:0}
.dpad .l{top:calc(50% - 11px);left:10px;border-right:15px solid var(--ash);border-left:0}.dpad .r{top:calc(50% - 11px);right:10px;border-left:15px solid var(--ash);border-right:0}

.dpad b{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;border-radius:50%;background:rgba(196,18,28,0.35)}
#acts{margin-left:auto;display:grid;grid-template-columns:repeat(2,auto);gap:12px;align-items:end;direction:rtl}
#acts.one{grid-template-columns:auto}.lacts{display:flex;align-items:flex-end}.pbtn.huge{width:104px;height:104px}.pbtn.huge span{font-size:22px}

.pbtn small{font-size:8px;color:var(--ash);letter-spacing:0.04em}
.pbtn.on{background:rgba(196,18,28,0.85)}.pbtn.big{width:90px;height:90px}.pbtn.gold{box-shadow:inset 0 0 0 2px rgba(255,227,106,0.7)}

.hs-notouch #pad{display:none!important}

.vstick{position:fixed;z-index:20;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,38,48,0.6);pointer-events:none;display:none}
.vstick b{position:absolute;left:34px;top:34px;width:44px;height:44px;border-radius:50%;background:rgba(255,38,48,0.6)}

.mclose{position:absolute;top:8px;right:10px;width:34px;height:34px;border:0;background:#140809;color:var(--bone);font-size:18px;cursor:pointer;box-shadow:inset 0 0 0 1px #4a1a1c;z-index:2}

.mbox{position:relative;margin:auto 0;touch-action:pan-y;width:min(520px,100%);max-height:none;display:flex;flex-direction:column;gap:10px;padding:18px 18px 16px;background:#0e0708;box-shadow:inset 0 0 0 2px #c4121c,0 0 30px rgba(196,18,28,0.25);clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px);overflow:auto}

.mbtn:hover,.mbtn:focus-visible,.mbtn.hs-focus{background:#2a0a0e;box-shadow:inset 0 0 0 2px #ff2630;outline:none}
.mbtn:disabled{opacity:0.4;cursor:default}
.mbtn.hot{background:#c4121c;box-shadow:inset 0 0 0 2px #ff2630}.mbtn.hot small{color:#f1e7d0}
.mbtn.gold{box-shadow:inset 0 0 0 1px #ffe36a}.mbtn.gold span{color:var(--gold)}
.mbtn.done span::after{content:'  \2713';color:var(--gold)}

.mbox.title{width:min(820px,100%);background:none;box-shadow:none;clip-path:none;padding:8px 6px}

  KIT.menu({ cls: 'clear', logo: '../assets/sk-logo.webp', title: 'Skeet Fighter', items: [
    { label: 'Arcade', fn: function () { toSelect(false); } },
    SV.rushOpen ? { label: 'Boss Rush', fn: function () { toSelect(true); } } : null,
    { label: 'Story', fn: storyMenu },
    { label: 'How to Play', fn: helpMenu },
    { label: 'Options', fn: function () { optionsMenu(titleMenu); } }] });
}
function storyMenu() { KIT.menu({ title: 'Skeet Fighter', html: STORY.map(function (s) { return '<p>' + s + '</p>'; }).join(''), items: [{ label: 'Back', back: true, fn: titleMenu }] }); }
function helpMenu(back) {
  KIT.menu({ title: 'How to Play', html: '<p><b>Move</b>: d-pad, stick or arrows/WASD (up and down walk into and out of the screen). <b>A</b> attack (keep pressing for a combo; it also picks things up), <b>B</b> jump, <b>X</b> special, <b>Y</b> super when the meter is full. Double tap forward to run, A while running for a dash attack, A in the air for a flying kick.</p>' +
    '<p><b>Specials</b>: X on its own is the fireball. UP + X the rising move, FORWARD + X the dash, DOWN + X the ground move. <b>Street Fighter motions</b> do the stronger EX version for free: down, down-forward, forward + A (EX fireball) and forward, down, down-forward + A (EX rising move). X at the end of a combo that hit cancels into the fireball.</p>' +
    '<p><b>Grab</b>: walk into someone. A knees them, A with a direction throws them into the others. <b>Breakaway</b>: X while you are being hit knocks everyone off you for a little health.</p>' +
    '<p><b>Pick ups</b>: smash bins, crates, barrels and coffins. Food heals (Cum Crackers, Cumpuccinos, Greebo\'s pies, Amy\'s chilli). Weapons wear out (the bar under the icon): swing them with A, DOWN + A throws a melee weapon. Get knocked down and you drop it.</p>' +
    '<p>The <b>Blumwashed homunculi</b> are not evil, just full of goo: beat it out of them and they go home.</p>', items: [{ label: 'Back', back: true, fn: back || titleMenu }] });
}
function optionsMenu(back) {
  KIT.menu({ title: 'Options', items: [KIT.resItem(function () { optionsMenu(back); }),
    SV.hardOpen ? { label: 'DIFFICULTY: ' + (SV.hard ? 'HARD' : 'NORMAL'), fn: function () { SV.hard = !SV.hard; persist(); optionsMenu(back); } } : { label: 'DIFFICULTY: NORMAL', sub: 'Hard opens when you beat Blumhead', dis: true },
    { label: 'Back', back: true, fn: back }] });
}
function toSelect(rush) { KIT.closeMenu(); G.mode = 'select'; G.rushPick = rush; G.sel = G.sel || 0; G.selBox = []; music.play('sktitle'); }
function stepSelect() {
  if (KIT.pressed('right')) { G.sel = (G.sel + 1) % 4; sfx.play('blip'); } if (KIT.pressed('left')) { G.sel = (G.sel + 3) % 4; sfx.play('blip'); }
  if (KIT.ptr.tap && G.selBox) G.selBox.forEach(function (b, i) { var p = KIT.ptr; if (p.x > b[0] && p.x < b[0] + b[2] && p.y > b[1] && p.y < b[1] + b[3]) { if (G.sel === i) pickFighter(); else { G.sel = i; sfx.play('blip'); } } });
  if (KIT.pressed('a') || KIT.pressed('start')) pickFighter();
  if (KIT.pressed('b')) titleMenu();
}
function pickFighter() { sfx.play('fight'); newGame(HEROLIST[G.sel], { rush: G.rushPick }); }
function pauseMenu() {
  if (G.mode !== 'play' && G.mode !== 'card') return;
  KIT.menu({ cls: 'clear', title: 'Paused', sub: G.S.n + (G.rush ? ' (Boss Rush)' : ''), items: [{ label: 'Resume', fn: KIT.closeMenu }, { label: 'Move List', fn: moveList }, { label: 'How to Play', fn: function () { helpMenu(pauseMenu); } }, { label: 'Options', fn: function () { optionsMenu(pauseMenu); } }, { label: 'Quit to Title', fn: titleMenu }] });
}
function moveList() {
  var H = P.hero, sp = H.sp;
  KIT.menu({ title: H.n, html: '<p><b>A A A A</b>: combo, ending in ' + (H.combo[H.combo.length - 1].n || 'a finisher') + '. <b>Run + A</b>: ' + (H.dash.n || 'dash attack') + '. <b>Air A</b>: ' + (H.air.n || 'flying kick') + '.</p>' +
    '<p><b>X</b>: ' + sp.fire.n + ' · <b>Up + X</b>: ' + sp.rise.n + ' · <b>Forward + X</b>: ' + sp.dash.n + ' · <b>Down + X</b>: ' + sp.ground.n + '</p>' +
    '<p><b>Down, down-forward, forward + A</b>: EX ' + sp.fire.n + ' · <b>Forward, down, down-forward + A</b>: EX ' + sp.rise.n + '</p><p><b>Y</b> (full meter): ' + sp.sup.n + '</p>', items: [{ label: 'Back', back: true, fn: pauseMenu }] });
}
/* ---------- the autopilot the tests use (G.bot): walks to the nearest foe, combos, specials, picks things up ---------- */
function botThink() {
  G.botA = G.botB = G.botX = G.botY = false; G.botK = null; if (!P) return;
  var t = botTarget(); G.botT = t;
  if (P.st === 'grab') { G.botA = Math.floor(G.t * 8) % 2 === 0; return; }
  if (P.st === 'atk' && P.mv && P.mvT > P.mv.st) { G.botA = true; P.buf = 1; return; }
  if (P.meter >= 100 && t && t.team === 'f') { G.botY = true; return; }
  if (!t) return; var dx = t.x - P.x, dz = t.z - P.z, reach = 22 + (t.w || 16) / 2;
  if (t.isItem) { if (Math.abs(dx) < 12 && Math.abs(dz) < 6) G.botA = true; return; }
  if (Math.abs(dx) < reach && Math.abs(dz) < 5) { P.face = dx >= 0 ? 1 : -1; if (Math.random() < 0.08) { G.botX = true; G.botK = pick(['rise', 'ground', 'dash']); } else G.botA = Math.floor(G.t * 10) % 2 === 0; }
  else if (Math.abs(dz) < 6 && Math.abs(dx) > 70 && Math.abs(dx) < 180 && P.spCd <= 0 && Math.random() < 0.03) { P.face = dx >= 0 ? 1 : -1; G.botX = true; G.botK = 'fire'; }
  if (P.st === 'hurt' && Math.random() < 0.05) G.botX = true;
  var danger = G.fx.some(function (f) { return f.k === 'mark' && Math.abs(f.x - P.x) < f.r + 8 && Math.abs(f.z - P.z) < 12; }) || (G.waves || []).some(function (w) { var d = Math.hypot(P.x - w.x, (P.z - w.z) * 2.6); return d > w.r && d - w.r < 30; }) || (G.beam && Math.abs(G.beam.z - P.z) < 12);
  if (danger) { G.botB = true; G.botDodge = 0.5; }
}
function botTarget() {
  var best = null, bd = 1e9;
  G.ents.forEach(function (e) { if (e.team !== 'f' || e.hp <= 0 || e.st === 'gone' || e.leaving || e.intro) return; var d = Math.abs(e.x - P.x) + Math.abs(e.z - P.z) * 2; if (d < bd) { bd = d; best = e; } });
  if (!best) { G.items.forEach(function (it) { if (it.h > 2 || (WEAPONS[it.id] && P.weapon) || it.x < G.cam + 12) return; var d = Math.abs(it.x - P.x) + Math.abs(it.z - P.z) * 2; if (d < bd && d < 220) { bd = d; best = { x: it.x, z: it.z, isItem: 1, w: 8 }; } }); }
  if (!best) G.props.forEach(function (p) { if (p.hp <= 0) return; var d = Math.abs(p.x - P.x) + Math.abs(p.z - P.z) * 2; if (d < bd && p.x > G.cam - 10 && p.x < G.cam + KIT.W + 60) { bd = d; best = p; } });
  return best;
}
function botInput() {
  var t = G.botT; if (G.botDodge > 0) { G.botDodge -= 1 / 60; return { mx: 0, mz: P.z > DEPTH / 2 ? -1 : 1 }; }
  if (!t) return { mx: 1, mz: 0 };
  var dx = t.x - P.x, dz = t.z - P.z, reach = t.isItem ? 4 : 18 + (t.w || 16) / 2;
  var mx = Math.abs(dx) > reach ? Math.sign(dx) : 0, mz = Math.abs(dz) > 3 ? Math.sign(dz) : 0;
  return { mx: mx, mz: mz };
}

KIT.start({ w: 384, h: 216, wide: 512, update: update, draw: draw, onPause: pauseMenu, startPauses: true,
  idleUpdate: function (dt) { if (G.mode === 'title') { G.t += dt; G.cam += 18 * dt; } },
  pad: { dpad: true, btns: [{ k: 'a', label: 'A', sub: 'HIT', cls: 'big' }, { k: 'b', label: 'B', sub: 'JUMP' }, { k: 'x', label: 'X', sub: 'SPECIAL' }, { k: 'y', label: 'Y', sub: 'SUPER', cls: 'gold' }] } });
titleMenu();
window.__sk = { G: G, get P() { return P; }, HEROES: HEROES, STAGES: STAGES, BOSSES: BOSSES, newGame: newGame, startStage: startStage, bossIntro: bossIntro, bossFight: bossFight, spawnFoe: spawnFoe, spawnBoss: spawnBoss, titleMenu: titleMenu, toSelect: toSelect,
  step: function (n) { for (var i = 0; i < n; i++) { KIT.tick(); update(1 / 60); } }, drawNow: function () { draw(); }, set mode(m) { G.mode = m; } };

</script>
