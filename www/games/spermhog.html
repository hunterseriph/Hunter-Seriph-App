<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><style>html,body{margin:0}body{font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Cumhead the Spermhog</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
/* Layout: one fixed-height game view (224 logical px tall) with a touch pad overlaid in landscape and below in portrait. Single dark look, blood red on black. */
:root{--bg:#070405;--ink:#0e0708;--line:#4a1a1c;--red:#c4121c;--hot:#ff2630;--bone:#f1e7d0;--ash:#a6968f;--display:'Pirata One',serif;--pixel:'Press Start 2P',monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--bone);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:relative;height:100%;display:flex;flex-direction:column;background:var(--bg)}
#view{position:relative;flex:1 1 auto;min-height:0;min-width:0;background:var(--bg)}
#c{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,0.14) 3px)}
#pad{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
#pad>*{pointer-events:auto}
#hint{display:none}
#hsTouchTgl{position:absolute;top:6px;left:calc(50% + 46px);transform:translateX(-50%);z-index:6;width:40px;height:40px;padding:0;border:0;background:rgba(14,7,8,0.7);box-shadow:inset 0 0 0 2px rgba(255,38,48,0.5);color:#f1e7d0;cursor:pointer;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}
#mute{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:6;width:40px;height:40px;padding:0;border:0;background:rgba(14,7,8,0.7);box-shadow:inset 0 0 0 2px rgba(255,38,48,0.5);cursor:pointer;display:flex;align-items:center;justify-content:center;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}
#mute svg{width:22px;height:22px}
#mute .sp{fill:var(--bone)}#mute .wv{stroke:var(--bone)}#mute .xx{stroke:var(--hot);display:none}
#mute.off .wv{display:none}#mute.off .xx{display:block}#mute.off .sp{fill:var(--ash)}
#mute:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.pbtn{appearance:none;border:0;margin:0;color:var(--bone);font-family:var(--pixel);font-size:10px;line-height:1.3;letter-spacing:0.04em;text-align:center;background:rgba(14,7,8,0.7);box-shadow:inset 0 0 0 2px rgba(255,38,48,0.6);touch-action:none;cursor:pointer}
.pbtn.on,#dpad.on{background:rgba(196,18,28,0.82)}
#dpad{width:176px;height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px);background:rgba(14,7,8,0.7);box-shadow:inset 0 0 0 2px rgba(255,38,48,0.6);touch-action:none}
#dpad svg{width:30px;height:30px;fill:var(--ash);transition:fill .05s}
#dpad[data-dir="L"] .al,#dpad[data-dir="R"] .ar{fill:var(--bone)}
#acts{display:flex;gap:12px;align-items:flex-end}
.oct{clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
#bA{width:88px;height:88px}
#bB{width:72px;height:72px}
.screen{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;background:rgba(7,4,5,0.78);text-align:center;overflow-y:auto}
.screen[hidden]{display:none}
h1,h2,p{margin:0}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,60px);line-height:0.95;color:var(--hot);text-shadow:0 0 22px rgba(196,18,28,0.65);text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:clamp(32px,8vw,48px);line-height:1;color:var(--hot);text-shadow:0 0 18px rgba(196,18,28,0.55)}
.px{font-family:var(--pixel);font-size:10px;line-height:1.7;letter-spacing:0.04em;color:var(--bone);max-width:42ch}
.dim{color:var(--ash)}
#titleSprite{height:92px;width:auto;image-rendering:pixelated;filter:drop-shadow(0 0 14px rgba(196,18,28,0.6))}
.btn{appearance:none;border:0;min-height:52px;min-width:220px;padding:0 28px;background:linear-gradient(180deg,#d8141f 0%,#8e0c14 100%);color:var(--bone);font-family:var(--pixel);font-size:12px;letter-spacing:0.08em;cursor:pointer;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%)}
.btn:focus-visible,.pbtn:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
@media (max-aspect-ratio:1/1){
  #view{flex:none;width:100%;aspect-ratio:5/4}
  #pad{position:relative;flex:1 1 auto;align-items:center;padding:16px}
  #hint{display:block;position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;font-family:var(--pixel);font-size:8px;line-height:1.6;color:var(--ash);pointer-events:none}
}
@media (max-height:340px){ #bA{width:72px;height:72px} #bB{width:60px;height:60px} #dpad{height:68px;width:150px} }
</style>

<div id="app">
 <div id="view">
  <canvas id="c" aria-label="Cumhead the Spermhog game screen"></canvas>
  <div id="scan"></div>
  <button id="mute" type="button" aria-label="Sound on"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="sp" d="M3 9h4l5-4v14l-5-4H3z"/><path class="wv" d="M15 8.5a5 5 0 0 1 0 7M17.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2" stroke-linecap="round"/><path class="xx" d="M15 9l6 6M21 9l-6 6" fill="none" stroke-width="2" stroke-linecap="round"/></svg></button>

  <div id="title" class="screen">
   <canvas id="titleSprite" width="30" height="57" aria-hidden="true" style="display:none"></canvas>
   <h1 style="margin:0"><img src="../assets/hog-logo.webp" alt="Cumhead the Spermhog" style="display:block;margin:0 auto 2px;width:auto;max-width:min(92%,440px);max-height:min(24vh,20vw,200px);object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.8))"></h1>
   <p class="px">6 ACTS AND A BOSS</p>
   <button id="startBtn" class="btn" type="button">START</button>
   <p class="px dim">Run, jump on the red things, tap jump again in the air to double jump, grab drops, reach the goal. Beat the Blood King.</p>
   <p class="px dim" id="best"></p>
  </div>

  <div id="over" class="screen" hidden>
   <h2>Game over</h2>
   <p class="px" id="overTxt"></p>
   <button id="retryBtn" class="btn" type="button">TRY AGAIN</button>
  </div>

  <div id="clear" class="screen" hidden>
   <h2 id="clearH">Act clear</h2>
   <p class="px" id="clearTxt"></p>
   <p class="px dim" id="clearBest"></p>
   <button id="againBtn" class="btn" type="button">PLAY AGAIN</button>
  </div>
 </div>

 <div id="pad">
  <div id="dpad" data-dir="" role="group" aria-label="Move left or right">
   <svg class="al" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3v18L5 12z"></path></svg>
   <svg class="ar" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v18l12-9z"></path></svg>
  </div>
  <div id="acts">
   <button id="bB" class="pbtn oct" type="button" aria-label="Attack">B<br>FIRE</button>
   <button id="bA" class="pbtn oct" type="button" aria-label="Jump">A<br>JUMP</button>
  </div>
  <div id="hint">TURN YOUR PHONE SIDEWAYS FOR A BIGGER SCREEN</div>
 </div>
</div>
