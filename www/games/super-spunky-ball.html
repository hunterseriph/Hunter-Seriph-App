<script>
/* =====================================================================================================
   KIT: the shared engine for the newer games. One low-res canvas scaled up crisp, sprites from the game's
   own packed sheet, pixel text, Hunter's dark gothic windows, keyboard + controller (through padkit) +
   on-screen buttons + taps, a small synth for sound effects, Load Legacy's music engine, saves, and HTML
   menus that padkit can drive with a controller.
   A game calls KIT.start({ w, h, pad, update(dt), draw(), onPause() }) once.
   ===================================================================================================== */
var OPT = { mus: 1 };
var KIT = (function () {
  'use strict';
  var cv = document.getElementById('c'), main = cv.getContext('2d'), ctx = main, W = 480, H = 270, cfg = {}, S = 1;
  ctx.imageSmoothingEnabled = false;
  /* resolution (one setting for every game on this engine, 'hs-res'): auto = as sharp as the screen allows (up to 3x, or the game's
     own autoS on phones), or a cap of 2x / 1x. 1x draws the game at its own pixel size and lets the screen scale it up: much less work for a phone. */
  var RES = 'auto'; try { RES = localStorage.getItem('hs-res') || 'auto'; } catch (e) {}
  var TOUCH = 'ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0;
  function maxS() { return RES === 'auto' ? (TOUCH && cfg.autoS ? cfg.autoS : 3) : +RES || 3; }
  var RESNAME = { auto: 'SHARPEST', '2': 'BALANCED', '1': 'FASTEST' };
  function setRes(v) { RES = v; try { localStorage.setItem('hs-res', v); } catch (e) {} S = 0; fit(); }
  function resItem(back) { return { label: 'RESOLUTION: ' + RESNAME[RES], fn: function () { setRes(RES === 'auto' ? '2' : RES === '2' ? '1' : 'auto'); if (back) back(); } }; }
  /* the canvas is drawn at a whole multiple of its size (up to 3x) so text stays sharp and pixel art stays square */
  function fit() {
    var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    if (cfg.flex && r.width > 0 && r.height > 0) { // o.flex: N - the short side stays cfg.h and the long side follows the screen up to N px, so a phone held upright gets a tall picture
      var ar = r.width / r.height, fw, fh; if (ar >= 1) { fh = cfg.h; fw = Math.max(cfg.w, Math.min(cfg.flex, Math.round(fh * ar))); } else { fw = cfg.h; fh = Math.max(cfg.h, Math.min(cfg.flex, Math.round(fw / ar))); }
      if (fw !== W || fh !== H) { W = fw; H = fh; S = 0; }
    }
    if (cfg.wide && r.width > 0 && r.height > 0) { var nw = Math.max(cfg.w || 480, Math.min(cfg.wide, Math.round(H * r.width / r.height))); if (nw !== W) { W = nw; S = 0; } } // o.wide: the picture widens to fill wide screens (up to that many pixels) instead of leaving black bars
    var k = Math.min(r.width / W, r.height / H) * dpr;

    if (s !== S || cv.width !== W * s) { S = s; cv.width = W * S; cv.height = H * S; main.imageSmoothingEnabled = false; layers = {}; }
  }

  var amb = document.getElementById('amb'), ambC = amb && amb.getContext('2d');
  function ambient() {
    if (!ambC) return; var r = cv.getBoundingClientRect(), bars = Math.abs(r.width / r.height - W / H) > 0.05 && !cfg.wide;
    amb.style.display = bars ? '' : 'none'; if (!bars) return;
    try { ambC.drawImage(cv, 0, 0, amb.width, amb.height); } catch (e) {}
  }

  var layers = {};
  /* o.px: painted at the game's own pixel size (chunky, Mega Drive style) instead of the screen's; o.crisp: soft edges are cut to hard ones
     (every pixel either solid or clear, no see-through fades); o.dim: darkened by that much (solid, not see-through) */
