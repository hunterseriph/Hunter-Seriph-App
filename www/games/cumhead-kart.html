<style>

#top svg{width:20px;height:20px}

  background:linear-gradient(135deg,#c4121c 0 7px,transparent 7px) top left/14px 14px no-repeat,linear-gradient(225deg,#c4121c 0 7px,transparent 7px) top right/14px 14px no-repeat,linear-gradient(45deg,#c4121c 0 7px,transparent 7px) bottom left/14px 14px no-repeat,linear-gradient(315deg,#c4121c 0 7px,transparent 7px) bottom right/14px 14px no-repeat}

<script>
/* =====================================================================================================
   KIT: the shared engine for the newer games. One low-res canvas scaled up crisp, sprites from the game's
   own packed sheet, pixel text, Hunter's dark gothic windows, keyboard + controller (through padkit) +
   on-screen buttons + taps, a small synth for sound effects, Load Legacy's music engine, saves, and HTML
   menus that padkit can drive with a controller.
   A game calls KIT.start({ w, h, pad, update(dt), draw(), onPause() }) once.
   ===================================================================================================== */
var OPT = { mus: 1 };
var KIT = (function () {
  'use strict';
  var cv = document.getElementById('c'), main = cv.getContext('2d'), ctx = main, W = 480, H = 270, cfg = {}, S = 1;
  ctx.imageSmoothingEnabled = false;
  /* resolution (one setting for every game on this engine, 'hs-res'): auto = as sharp as the screen allows (up to 3x, or the game's
     own autoS on phones), or a cap of 2x / 1x. 1x draws the game at its own pixel size and lets the screen scale it up: much less work for a phone. */
  var RES = 'auto'; try { RES = localStorage.getItem('hs-res') || 'auto'; } catch (e) {}
  var TOUCH = 'ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0;
  function maxS() { return RES === 'auto' ? (TOUCH && cfg.autoS ? cfg.autoS : 3) : +RES || 3; }
  var RESNAME = { auto: 'SHARPEST', '2': 'BALANCED', '1': 'FASTEST' };
  function setRes(v) { RES = v; try { localStorage.setItem('hs-res', v); } catch (e) {} S = 0; fit(); }
  function resItem(back) { return { label: 'RESOLUTION: ' + RESNAME[RES], fn: function () { setRes(RES === 'auto' ? '2' : RES === '2' ? '1' : 'auto'); if (back) back(); } }; }
  /* the canvas is drawn at a whole multiple of its size (up to 3x) so text stays sharp and pixel art stays square */
  function fit() {
    var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    if (cfg.flex && r.width > 0 && r.height > 0) { // o.flex: N - the short side stays cfg.h and the long side follows the screen up to N px, so a phone held upright gets a tall picture
      var ar = r.width / r.height, fw, fh; if (ar >= 1) { fh = cfg.h; fw = Math.max(cfg.w, Math.min(cfg.flex, Math.round(fh * ar))); } else { fw = cfg.h; fh = Math.max(cfg.h, Math.min(cfg.flex, Math.round(fw / ar))); }
      if (fw !== W || fh !== H) { W = fw; H = fh; S = 0; }
    }
    if (cfg.wide && r.width > 0 && r.height > 0) { var nw = Math.max(cfg.w || 480, Math.min(cfg.wide, Math.round(H * r.width / r.height))); if (nw !== W) { W = nw; S = 0; } } // o.wide: the picture widens to fill wide screens (up to that many pixels) instead of leaving black bars
    var k = Math.min(r.width / W, r.height / H) * dpr;
    var s = Math.max(1, Math.min(maxS(), Math.round(k))); if (!(s > 0)) s = 1;
    if (s !== S || cv.width !== W * s) { S = s; cv.width = W * S; cv.height = H * S; main.imageSmoothingEnabled = false; layers = {}; }
  }
  window.addEventListener('resize', function () { setTimeout(fit, 50); });
  /* the bars either side of the picture (on screens of a different shape) show a dark, blurred copy of it instead of plain black */
  var amb = document.getElementById('amb'), ambC = amb && amb.getContext('2d');
  function ambient() {
    if (!ambC) return; var r = cv.getBoundingClientRect(), bars = Math.abs(r.width / r.height - W / H) > 0.05 && !cfg.wide;
    amb.style.display = bars ? '' : 'none'; if (!bars) return;
    try { ambC.drawImage(cv, 0, 0, amb.width, amb.height); } catch (e) {}
  }
  /* cached layers: draw static things (floors, walls, backdrops) once into a canvas, then blit them each frame */
  var layers = {};
  /* o.px: painted at the game's own pixel size (chunky, Mega Drive style) instead of the screen's; o.crisp: soft edges are cut to hard ones
     (every pixel either solid or clear, no see-through fades); o.dim: darkened by that much (solid, not see-through) */

/* a real throne, built from blocks and stood against the wall (it used to be a flat picture that floated over the road) */
function throne3d(B, p, q, back, gold) {
  var sd = 1, ix = -q.nx * sd, iz = -q.nz * sd, ry = Math.atan2(-ix, iz), c = Math.cos(ry), s = Math.sin(ry), RED = [1.15, 0.22, 0.2];
  function at(dx, dz) { return [p.x + c * dx + ix * dz, p.z + s * dx + iz * dz]; }
  function blk(dx, dy, dz, w, d, h, t, tt, col) { var a = at(dx, dz); B.box(a[0], p.y + dy, a[1], w, d, h, ry, t, tt, col); }
  blk(0, -0.4, 0.4, 6, 4.4, 0.6, gold, gold);                 // the dais
  blk(0, 0.2, 0.9, 4.4, 2.8, 0.5, gold, gold, RED);           // a step of red carpet
  blk(0, 0.2, -0.9, 3.4, 0.7, 7.2, back, gold);              // the tall back
  blk(0, 7.4, -0.9, 3.8, 0.9, 0.5, gold, gold);               // gold crest along the top
  [-1.3, 0, 1.3].forEach(function (dx, k) { blk(dx, 7.9, -0.9, 0.5, 0.5, k === 1 ? 1.4 : 0.8, gold, gold); }); // its spikes
  blk(0, 0.2, 0.1, 3, 2, 1.7, back, gold, RED);               // the seat, red cushion on top
  blk(0, 1.9, -0.45, 2.6, 0.3, 4.6, gold, gold, RED);         // the back cushion
  [-1.55, 1.55].forEach(function (dx) { blk(dx, 0.2, 0.15, 0.45, 2.3, 2.9, gold, gold); }); // arms
  var l = at(0, 1.6); B.light(l[0], p.y + 5, l[1], 14, [0.9, 0.45, 0.25], '#ffc060');
}

/* ---------- update 130: driver bodies. Arms with a shoulder, a bicep, a proper elbow, a forearm that tapers to a cuff,
   and gloves with four fingers wrapped round the wheel and a thumb on top (they were tubes ending in a ball) ---------- */
function mitt(m, fr, W, f, s, u, col, sd) {
  ball2(m, fr, W, f, s, u, 0.08, 0.07, 0.066, col, 8, { rings: 4 }); // the palm
  if (DLOD < 1) { ball2(m, fr, W, f + 0.05, s, u - 0.01, 0.05, 0.065, 0.05, col, 6, { rings: 3 }); return; }
  for (var i = 0; i < 4; i++) { var o = (i - 1.5) * 0.034, a = [f + 0.035, s + o, u + 0.035], b = [f + 0.085, s + o, u + 0.0], c = [f + 0.06, s + o, u - 0.05]; tube(m, fr, W, a, b, 0.021, 0.019, col, 5); tube(m, fr, W, b, c, 0.019, 0.015, col, 5, { cap: shade3(col, 0.8) }); } // fingers curl over and under the rim
  tube(m, fr, W, [f - 0.01, s - sd * 0.055, u + 0.02], [f + 0.045, s - sd * 0.075, u + 0.06], 0.024, 0.018, col, 5, { cap: shade3(col, 0.8) }); // the thumb
}
function shade3(col, k) { var c = rgb01(col), h = function (v) { var s = Math.max(0, Math.min(255, Math.round(v * 255 * k))).toString(16); return s.length < 2 ? '0' + s : s; }; return '#' + h(c[0]) + h(c[1]) + h(c[2]); }
function arms(m, fr, W, sh, up, fore, hand, wob, thick) {
  thick = thick || 1;
  [-1, 1].forEach(function (sd) {
    var S = [-0.24, sd * sh, 0.88], E = [0.04, sd * (sh - 0.02), 0.66], H = [0.4, sd * 0.15 + sd * wob, 0.64 + sd * wob], M1 = [(S[0] + E[0]) / 2 - 0.01, (S[1] + E[1]) / 2 + sd * 0.012, (S[2] + E[2]) / 2 + 0.012], M2 = [E[0] + (H[0] - E[0]) * 0.3, E[1] + (H[1] - E[1]) * 0.3, E[2] + (H[2] - E[2]) * 0.3 + 0.008], WR = [E[0] + (H[0] - E[0]) * 0.86, E[1] + (H[1] - E[1]) * 0.86, E[2] + (H[2] - E[2]) * 0.86];
    ball2(m, fr, W, S[0], S[1], S[2], 0.118 * thick, 0.118 * thick, 0.108 * thick, up, 8, { rings: 5 }); // the shoulder
    tube(m, fr, W, S, M1, 0.088 * thick, 0.096 * thick, up, 8); tube(m, fr, W, M1, E, 0.096 * thick, 0.074 * thick, up, 8); // upper arm, fuller in the middle
    ball2(m, fr, W, E[0], E[1], E[2], 0.078 * thick, 0.078 * thick, 0.078 * thick, up, 7, { rings: 4 });
    tube(m, fr, W, E, M2, 0.072 * thick, 0.078 * thick, fore, 8); tube(m, fr, W, M2, WR, 0.078 * thick, 0.056 * thick, fore, 8); // forearm, tapering to the wrist
    if (fore !== hand) tube(m, fr, W, WR, [WR[0] + (H[0] - WR[0]) * 0.5, WR[1] + (H[1] - WR[1]) * 0.5, WR[2] + (H[2] - WR[2]) * 0.5], 0.066 * thick, 0.07 * thick, shade3(fore, 0.72), 8); // the cuff
    else tube(m, fr, W, WR, H, 0.056 * thick, 0.058 * thick, hand, 6);
    mitt(m, fr, W, H[0] + 0.02, H[1], H[2], hand, sd);
  });
}
